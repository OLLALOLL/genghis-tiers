        <div class="form-grid">
          <input id="ban-preset-new" type="text" placeholder="e.g. Cheating / X-ray" maxlength="60">
        </div>
        <button class="btn secondary" id="ban-preset-add" style="margin-top:10px;">Add preset</button>
      </div>
    </details>

    <details class="info-card settings-card wide ${so("Admin display names")}">
      <summary class="info-card-head">
        <div class="info-card-icon">🪪</div>
        <h2>Admin display names</h2>
      </summary>
      <div class="settings-card-body">
        <p>Only ${escapeHtml(OWNER_ADMIN_EMAIL)} can set these. The name shown here replaces an admin's login email on Recent activity and the Tier Log for any change they make from now on.</p>
        <div class="admin-table" id="admin-names-table">
          <div class="confirm-row head admin-names-row">
            <div>Email</div><div>Display name</div><div></div>
          </div>
          ${rows.length === 0 ? `<div class="empty">No admin names set yet — add one below.</div>` : rows.map(r => `
            <div class="confirm-row admin-names-row" data-email="${escapeAttr(r.email)}">
              <div>${escapeHtml(r.email)}</div>
              <div><input type="text" class="admin-name-row-input" value="${escapeAttr(r.display_name || '')}" maxlength="40" style="width:100%;"></div>
              <div><button class="btn secondary admin-name-row-save">Save</button></div>
            </div>
          `).join('')}
        </div>
        <div class="admin-head" style="margin-top:18px;margin-bottom:6px;">
          <h2 style="font-size:14px;">Add an admin</h2>
        </div>
        <div class="form-grid">
          <input id="admin-name-new-email" type="email" placeholder="Email">
          <input id="admin-name-new-name" type="text" placeholder="Display name" maxlength="40">
        </div>
        <button class="btn" id="admin-name-add" style="margin-top:10px;">Add / update</button>
        <div class="err" id="admin-name-err"></div>
      </div>
    </details>
  </div>
  `;

  document.getElementById('tagline-save').addEventListener('click', async () => {
    const val = document.getElementById('tagline-input').value.trim() || DEFAULT_TAGLINE;
    const ok = await saveSiteSettings({ tagline: val });
    if(ok){ applyTaglineToDOM(); showToast('Tagline saved'); }
  });
  document.getElementById('tagline-reset').addEventListener('click', async () => {
    document.getElementById('tagline-input').value = DEFAULT_TAGLINE;
    const ok = await saveSiteSettings({ tagline: DEFAULT_TAGLINE });
    if(ok){ applyTaglineToDOM(); showToast('Tagline reset to default'); }
  });

  content.querySelectorAll('.kit-visibility-toggle').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const kitId = e.target.getAttribute('data-kit');
      const shown = e.target.checked;
      const hidden = siteSettings.hidden_kits || [];
      const next = shown ? hidden.filter(id => id !== kitId) : [...hidden, kitId];
      const ok = await saveSiteSettings({ hidden_kits: next });
      if(ok){
        showToast(shown ? 'Kit shown' : 'Kit hidden');
        renderAdminSettings();
      }else{
        e.target.checked = !shown;
      }
    });
  });

  document.getElementById('maintenance-toggle').addEventListener('change', async (e) => {
    const on = e.target.checked;
    const ok = await saveSiteSettings({ maintenance_mode: on });
    if(ok){
      showToast(on ? 'Maintenance mode turned on' : 'Maintenance mode turned off');
      renderAdminSettings();
    }else{
      e.target.checked = !on;
    }
  });

  document.getElementById('ban-preset-add').addEventListener('click', async () => {
    const input = document.getElementById('ban-preset-new');
    const val = input.value.trim();
    if(!val) return;
    const next = [...siteSettings.ban_reason_presets, val];
    const ok = await saveSiteSettings({ ban_reason_presets: next });
    if(ok) renderAdminSettings();
  });
  content.querySelectorAll('.ban-preset-remove').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const next = siteSettings.ban_reason_presets.filter((_, i) => i !== idx);
      const ok = await saveSiteSettings({ ban_reason_presets: next });
      if(ok) renderAdminSettings();
    });
  });

  content.querySelectorAll('.admin-name-row-save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('[data-email]');
      const email = row.getAttribute('data-email');
      const name = row.querySelector('.admin-name-row-input').value.trim();
      if(!name) return;
      const ok = await saveAdminDisplayName(email, name);
      if(ok){
        showToast('Saved');
        if(email === adminEmail) adminIdentity = name;
      }
    });
  });

  document.getElementById('admin-name-add').addEventListener('click', async () => {
    const email = document.getElementById('admin-name-new-email').value.trim();
    const name = document.getElementById('admin-name-new-name').value.trim();
    const errEl = document.getElementById('admin-name-err');
    if(!email || !name){
      errEl.textContent = 'Enter both an email and a name.';
      return;
    }
    errEl.textContent = '';
    const ok = await saveAdminDisplayName(email, name);
    if(ok){
      showToast('Admin name saved');
      if(email === adminEmail) adminIdentity = name;
      renderAdminSettings();
    }
  });

  // Kit order drag-and-drop
  let dragKitId = null;
  content.querySelectorAll('.kit-order-row').forEach(row => {
    row.addEventListener('dragstart', () => { dragKitId = row.getAttribute('data-kit'); row.style.opacity = '0.5'; });
    row.addEventListener('dragend', () => { row.style.opacity = '1'; });
    row.addEventListener('dragover', (e) => { e.preventDefault(); });
    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      const targetId = row.getAttribute('data-kit');
      if(!dragKitId || dragKitId === targetId) return;
      const currentOrder = visibleGamemodes().filter(g => g.id !== 'overall').map(g => g.id);
      const fromIdx = currentOrder.indexOf(dragKitId);
      const toIdx = currentOrder.indexOf(targetId);
      if(fromIdx === -1 || toIdx === -1) return;
      currentOrder.splice(fromIdx, 1);
      currentOrder.splice(toIdx, 0, dragKitId);
      const ok = await saveSiteSettings({ kit_order: currentOrder });
      if(ok) renderAdminSettings();
    });
  });

  // Stats page section order drag-and-drop
  let dragSectionId = null;
  content.querySelectorAll('.stats-order-row').forEach(row => {
    row.addEventListener('dragstart', () => { dragSectionId = row.getAttribute('data-section'); row.style.opacity = '0.5'; });
    row.addEventListener('dragend', () => { row.style.opacity = '1'; });
    row.addEventListener('dragover', (e) => { e.preventDefault(); });
    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      const targetId = row.getAttribute('data-section');
      if(!dragSectionId || dragSectionId === targetId) return;
      const currentOrder = (siteSettings.stats_section_order && siteSettings.stats_section_order.length === DEFAULT_STATS_ORDER.length)
        ? [...siteSettings.stats_section_order] : DEFAULT_STATS_ORDER.slice();
      const fromIdx = currentOrder.indexOf(dragSectionId);
      const toIdx = currentOrder.indexOf(targetId);
      if(fromIdx === -1 || toIdx === -1) return;
      currentOrder.splice(fromIdx, 1);
      currentOrder.splice(toIdx, 0, dragSectionId);
      const ok = await saveSiteSettings({ stats_section_order: currentOrder });
      if(ok) renderAdminSettings();
    });
  });

  // Remember which settings cards the admin has expanded across re-renders.
  content.querySelectorAll('.settings-card').forEach(d => {
    const h2 = d.querySelector('summary h2');
    if(!h2) return;
    const title = h2.textContent;
    d.addEventListener('toggle', () => {
      if(d.open) settingsOpenSections.add(title);
      else settingsOpenSections.delete(title);
    });
  });

  document.getElementById('tie-break-select').addEventListener('change', async (e) => {
    const ok = await saveSiteSettings({ tie_break: e.target.value });
    if(ok) showToast('Tie-break rule saved');
  });

  document.getElementById('announcement-save').addEventListener('click', async () => {
    const text = document.getElementById('announcement-input').value.trim();
    const enabled = document.getElementById('announcement-toggle').checked;
    const ok = await saveSiteSettings({ announcement_text: text, announcement_enabled: enabled });
    if(ok){ showToast('Announcement saved'); renderAnnouncementBanner(); renderAdminSettings(); }
  });

  document.getElementById('appeal-link-save').addEventListener('click', async () => {
    const val = document.getElementById('appeal-link-input').value.trim();
    const ok = await saveSiteSettings({ appeal_link: val });
    if(ok) showToast('Appeal link saved');
  });

  document.getElementById('footer-text-save').addEventListener('click', async () => {
    const val = document.getElementById('footer-text-input').value.trim();
    const ok = await saveSiteSettings({ footer_text: val });
    if(ok){ applyFooterToDOM(); showToast('Footer text saved'); }
  });

  document.getElementById('accent-color-save').addEventListener('click', async () => {
    const val = document.getElementById('accent-color-input').value;
    const ok = await saveSiteSettings({ accent_color: val });
    if(ok){ applyAccentColorToDOM(); showToast('Accent color saved'); }
  });
  document.getElementById('accent-color-reset').addEventListener('click', async () => {
    document.getElementById('accent-color-input').value = DEFAULT_ACCENT;
    const ok = await saveSiteSettings({ accent_color: '' });
    if(ok){ applyAccentColorToDOM(); showToast('Accent color reset to default'); }
  });

  document.getElementById('lockout-save').addEventListener('click', async () => {
    const attempts = Math.max(1, parseInt(document.getElementById('lockout-attempts-input').value, 10) || 5);
    const minutes = Math.max(1, parseInt(document.getElementById('lockout-minutes-input').value, 10) || 5);
    const ok = await saveSiteSettings({ login_lockout_attempts: attempts, login_lockout_minutes: minutes });
    if(ok) showToast('Login lockout settings saved');
  });

  document.getElementById('session-timeout-save').addEventListener('click', async () => {
    const minutes = Math.max(0, parseInt(document.getElementById('session-timeout-input').value, 10) || 0);
    const ok = await saveSiteSettings({ session_timeout_minutes: minutes });
    if(ok){ showToast('Session timeout saved'); resetSessionTimeoutTimer(); }
  });

  document.getElementById('maintenance-window-save').addEventListener('click', async () => {
    const startVal = document.getElementById('maintenance-start-input').value;
    const endVal = document.getElementById('maintenance-end-input').value;
    const start = startVal ? new Date(startVal).toISOString() : null;
    const end = endVal ? new Date(endVal).toISOString() : null;
    const ok = await saveSiteSettings({ maintenance_start: start, maintenance_end: end });
    if(ok) showToast('Maintenance window saved');
  });
  document.getElementById('maintenance-window-clear').addEventListener('click', async () => {
    document.getElementById('maintenance-start-input').value = '';
    document.getElementById('maintenance-end-input').value = '';
    const ok = await saveSiteSettings({ maintenance_start: null, maintenance_end: null });
    if(ok) showToast('Maintenance window cleared');
  });

  document.getElementById('owner-pin-save').addEventListener('click', async () => {
    const val = document.getElementById('owner-pin-input').value.trim();
    const ok = await saveOwnerPin(val);
    if(ok){ showToast(val ? 'PIN saved' : 'PIN cleared'); renderAdminSettings(); }
  });
}

function renderAdminRoster(){
  const content = document.getElementById('admin-content');
  const list = sortedPlayers(players).filter(p => !adminSearch || p.name.toLowerCase().includes(adminSearch.toLowerCase()));

  content.innerHTML = `
    <div class="hint">Changes save automatically and appear on the public leaderboard for everyone.</div>

    <div class="form-card">
      <div class="eyebrow">ADD / UPDATE A TIER</div>
      <div class="form-grid">
        <div class="field"><label>IGN</label><input id="add-ign" type="text" placeholder="Player name" autocomplete="off"></div>
        <div class="field"><label>Region</label>
          <select id="add-region">${REGIONS.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Country</label>
          <select id="add-country">
            <option value="">None</option>
            ${COUNTRIES.map(c=>`<option value="${c.code}">${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Kit</label>
          <select id="add-kit">${KITS.map(k=>`<option value="${k.id}">${k.label}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Points</label><input id="add-points" type="number" value="0" min="1" max="60"></div>
        <button class="btn" id="add-tier-btn">Add</button>
      </div>
      <div class="hint" style="margin-top:12px; display:flex; align-items:center; gap:8px;">
        Preview: <span id="add-preview">${tierBadge('5','Low')}</span>
      </div>
      <div class="hint">If the IGN doesn't exist yet, it will be created. If they already have a tier in the chosen kit, you'll be asked to confirm before it's overwritten.</div>
      <div class="ign-preview" id="tier-confirm-bar">
        <div class="ign-preview-label" id="tier-confirm-text"></div>
        <button class="btn secondary" id="tier-confirm-yes" style="margin-right:8px;">Yes, overwrite</button>
        <button class="btn secondary" id="tier-confirm-no">Cancel</button>
      </div>
      <div class="ign-preview" id="ign-preview">
        <div class="ign-preview-label">Existing player — current tiers:</div>
        <div class="ign-preview-chips" id="ign-preview-chips"></div>
        <div class="banned-warning" id="ign-banned-warning" style="display:none;">⚠ This player is currently banned. Unban them before their tier can be updated.</div>
      </div>
    </div>

    <div class="admin-search">
      <input id="admin-search-input" type="text" placeholder="Search players..." value="${escapeAttr(adminSearch)}">
    </div>

    <div id="roster-bulk-bar" style="display:none;align-items:center;gap:10px;margin-bottom:10px;">
      <span class="hint" id="roster-bulk-count" style="margin:0;"></span>
      <button class="btn danger" id="roster-bulk-delete">Delete selected</button>
    </div>
    <div class="admin-table">
      <div class="admin-row head roster-cols">
        <div><input type="checkbox" id="roster-select-all" ${list.length > 0 && list.every(p => bulkSelectedIds.has(p.id)) ? 'checked' : ''}></div><div>Name</div><div>Region</div><div>Country</div><div>Points (auto)</div><div></div>
      </div>
      ${list.length === 0 ? `<div class="empty">No players match.</div>` :
        list.map(p => `
        ${pendingDeleteId === p.id ? deleteConfirmRowHTML(p) : `
        <div class="admin-row roster-cols" data-id="${p.id}">
          <input type="checkbox" class="roster-select" data-id="${p.id}" ${bulkSelectedIds.has(p.id) ? 'checked' : ''}>
          <input class="e-name" type="text" value="${escapeAttr(p.name)}">
          <select class="e-region">${REGIONS.map(r=>`<option value="${r}" ${r===p.region?'selected':''}>${r}</option>`).join('')}</select>
          <select class="e-country">
            <option value="" ${!p.country ? 'selected' : ''}>None</option>
            ${COUNTRIES.map(c=>`<option value="${c.code}" ${c.code===p.country?'selected':''}>${c.name}</option>`).join('')}
          </select>
          <div class="points-readout">${recomputeTotal(p).toLocaleString()}${p.banned ? '<span class="banned-badge">BANNED</span>' : ''}</div>
          <div class="row-actions">
            <button class="icon-btn kits-toggle-btn" title="Edit gamemode tiers" data-id="${p.id}">${expandedKitPlayerId===p.id ? '▲' : 'GM'}</button>
            <button class="icon-btn danger del-btn" title="Remove player" data-id="${p.id}">✕</button>
          </div>
        </div>
        `}
        ${expandedKitPlayerId === p.id ? renderKitPanel(p) : ''}
      `).join('')}
    </div>
  `;

  document.getElementById('admin-search-input').addEventListener('input', e => { adminSearch = e.target.value; withFocusPreserved(renderAdminRoster); });

  const updateRosterBulkBar = () => {
    const bar = document.getElementById('roster-bulk-bar');
    const count = document.getElementById('roster-bulk-count');
    if(bulkSelectedIds.size > 0){
      bar.style.display = 'flex';
      count.textContent = `${bulkSelectedIds.size} selected`;
    }else{
      bar.style.display = 'none';
    }
  };
  updateRosterBulkBar();
  const rosterSelectAll = document.getElementById('roster-select-all');
  if(rosterSelectAll) rosterSelectAll.addEventListener('change', (e) => {
    if(e.target.checked){ list.forEach(p => bulkSelectedIds.add(p.id)); }
    else{ list.forEach(p => bulkSelectedIds.delete(p.id)); }
    renderAdminRoster();
  });
  content.querySelectorAll('.roster-select').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const id = e.target.getAttribute('data-id');
      if(e.target.checked) bulkSelectedIds.add(id); else bulkSelectedIds.delete(id);
      updateRosterBulkBar();
    });
  });
  const rosterBulkDeleteBtn = document.getElementById('roster-bulk-delete');
  if(rosterBulkDeleteBtn) rosterBulkDeleteBtn.addEventListener('click', async () => {
    if(bulkSelectedIds.size === 0) return;
    if(!confirm(`Permanently delete ${bulkSelectedIds.size} selected player(s)? This can't be undone.`)) return;
    if(!(await ownerActionAllowed())){ showToast('Cancelled'); return; }
    for(const id of bulkSelectedIds){
      players = players.filter(x => x.id !== id);
      await deletePlayerRow(id);
    }
    bulkSelectedIds.clear();
    renderAdminRoster();
    renderBoard();
    showToast('Selected players deleted');
  });

  const ignInput = document.getElementById('add-ign');
  const updateIgnPreview = () => {
    const name = ignInput.value.trim();
    const preview = document.getElementById('ign-preview');
    const bannedWarning = document.getElementById('ign-banned-warning');
    if(!name){ preview.classList.remove('show'); return; }
    const match = players.find(x => x.name.toLowerCase() === name.toLowerCase());
    if(match){
      document.getElementById('ign-preview-chips').innerHTML = kitChipsHTML(match);
      bannedWarning.style.display = match.banned ? '' : 'none';
      preview.classList.add('show');
    }else{
      preview.classList.remove('show');
    }
  };
  ignInput.addEventListener('input', updateIgnPreview);

  const pointsInput = document.getElementById('add-points');
  const updatePreview = () => {
    const pts = Number(pointsInput.value) || 0;
    const match = pointsToTierSub(pts);
    document.getElementById('add-preview').innerHTML = match ? tierBadge(match.tier, match.sub) : `<span class="kit-chip-empty">Below Tier 5 — unranked</span>`;
  };
  pointsInput.addEventListener('input', updatePreview);
  document.getElementById('add-tier-btn').addEventListener('click', onAddTier);
  document.getElementById('tier-confirm-yes').addEventListener('click', () => confirmPendingTier(true));
  document.getElementById('tier-confirm-no').addEventListener('click', () => confirmPendingTier(false));

  content.querySelectorAll('.kits-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      expandedKitPlayerId = (expandedKitPlayerId === id) ? null : id;
      renderAdminRoster();
    });
  });

  content.querySelectorAll('.kit-points-input').forEach(inp => {
    const preview = () => {
      const id = inp.getAttribute('data-id');
      const kitId = inp.getAttribute('data-kit');
      const pts = Number(inp.value) || 0;
      const match = pointsToTierSub(pts);
      const previewEl = content.querySelector(`.kit-panel-preview[data-id="${id}"][data-kit="${kitId}"]`);
      if(previewEl){
        const p = players.find(x => x.id === id);
        const isRetired = !!(p && p.kits && p.kits[kitId] && p.kits[kitId].retired);
        previewEl.innerHTML = match ? tierBadge(match.tier, match.sub, isRetired) : `<span class="kit-chip-empty">Unranked</span>`;
      }
    };
    inp.addEventListener('input', preview);
    inp.addEventListener('change', async () => {
      const id = inp.getAttribute('data-id');
      const kitId = inp.getAttribute('data-kit');
      const p = players.find(x => x.id === id);
      if(!p) return;
      let pts = Number(inp.value) || 0;
      pts = Math.max(0, Math.min(60, pts));
      inp.value = pts;
      p.kits = p.kits || {};
      const before = p.kits[kitId] ? { ...p.kits[kitId] } : null;
      const wasRetired = !!(p.kits[kitId] && p.kits[kitId].retired);
      let after = null;
      if(pts <= 0){
        delete p.kits[kitId];
      }else{
        const match = pointsToTierSub(pts);
        after = { tier: match ? match.tier : "5", sub: match ? match.sub : "Low", points: pts, retired: wasRetired };
        p.kits[kitId] = after;
      }
      recomputeTotal(p);
      await updatePlayer(p);
      const changed = (before ? `${before.tier}|${before.sub}|${before.points}` : null) !== (after ? `${after.tier}|${after.sub}|${after.points}` : null);
      let historyOk = true;
      if(changed){
        historyOk = await logTierHistory(p, kitId, before, after, adminIdentity);
      }
      renderAdminRoster();
      renderBoard();
      if(historyOk) showToast('Saved');
    });
  });

  content.querySelectorAll('.kit-retire-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const kitId = btn.getAttribute('data-kit');
      const p = players.find(x => x.id === id);
      if(!p || !p.kits || !p.kits[kitId]) return;
      p.kits[kitId].retired = !p.kits[kitId].retired;
      await updatePlayer(p);
      renderAdminRoster();
      renderBoard();
      showToast(p.kits[kitId].retired ? 'Marked retired for this gamemode' : 'Unretired for this gamemode');
    });
  });

  content.querySelectorAll('.admin-row[data-id]').forEach(row => {
    const id = row.getAttribute('data-id');
    const nameInput = row.querySelector('.e-name');
    if(!nameInput) return;
    const commit = async () => {
      const p = players.find(x => x.id === id);
      if(!p) return;
      p.name = row.querySelector('.e-name').value.trim() || p.name;
      p.region = row.querySelector('.e-region').value;
      p.country = row.querySelector('.e-country').value;
      recomputeTotal(p);
      await updatePlayer(p);
      renderBoard();
      showToast('Saved');
    };
    row.querySelector('.e-name').addEventListener('change', commit);
    row.querySelector('.e-region').addEventListener('change', commit);
    row.querySelector('.e-country').addEventListener('change', commit);
  });

  content.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = btn.getAttribute('data-id');
      pendingDeleteStage = 1;
      renderAdminRoster();
    });
  });

  content.querySelectorAll('.confirm-delete-no').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingDeleteId = null;
      pendingDeleteStage = 0;
      renderAdminRoster();
    });
  });

  content.querySelectorAll('.confirm-delete-yes').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      if(pendingDeleteStage < 3){
        pendingDeleteStage += 1;
        renderAdminRoster();
        return;
      }
      if(!(await ownerActionAllowed())){ showToast('Cancelled'); return; }
      players = players.filter(x => x.id !== id);
      await deletePlayerRow(id);
      pendingDeleteId = null;
      pendingDeleteStage = 0;
      renderAdminRoster();
      renderBoard();
      showToast('Player removed');
    });
  });
}

function revertDescription(row){
  const kitLabel = row.kit ? ((KITS.find(k => k.id === row.kit) || {}).label || row.kit) : '';
  if(row.action === 'ban'){
    return `Revert this ban — unban ${row.player_name}?`;
  }
  if(row.action === 'unban'){
    return `Revert this unban — re-ban ${row.player_name}?`;
  }
  return `Revert ${row.player_name}'s ${kitLabel} tier back to ${row.old_tier ? `${row.old_sub} T${row.old_tier}` : 'Unranked'}?`;
}

async function revertActivityEntry(row){
  let p = players.find(x => x.id === row.player_id) || players.find(x => x.name.toLowerCase() === (row.player_name||'').toLowerCase());
  if(!p){ showToast("Couldn't find that player anymore"); return; }

  if(row.action === 'ban'){
    p.banned = false;
    p.banReason = '';
    await updatePlayer(p);
    await logTierHistory(p, null, null, null, 'Admin (revert)', 'unban');
    showToast('Ban reverted');
    return;
  }

  if(row.action === 'unban'){
    const priorBan = tierLogRows.find(x => x.player_id === row.player_id && x.action === 'ban' && new Date(x.created_at) < new Date(row.created_at));
    p.banned = true;
    p.banReason = priorBan ? (priorBan.note || '') : '';
    await updatePlayer(p);
    await logTierHistory(p, null, null, null, 'Admin (revert)', 'ban', p.banReason || null);
    showToast('Unban reverted');
    return;
  }

  const before = p.kits && p.kits[row.kit] ? { ...p.kits[row.kit] } : null;
  p.kits = p.kits || {};

  let after = null;
  if(row.old_tier){
    after = { tier: row.old_tier, sub: row.old_sub, points: row.old_points || 0 };
    p.kits[row.kit] = after;
  }else{
    delete p.kits[row.kit];
  }

  recomputeTotal(p);
  await updatePlayer(p);
  await logTierHistory(p, row.kit, before, after, 'Admin (revert)');
  showToast('Tier reverted');
}

function pointsToTierSub(points){
  if(points <= 0) return null;
  const entries = Object.entries(TIER_POINTS)
    .map(([key, value]) => { const [tier, sub] = key.split('|'); return { tier, sub, value }; })
    .sort((a, b) => b.value - a.value);
  let best = null;
  for(const e of entries){
    if(points >= e.value){ best = e; break; }
  }
  return best;
}

let pendingTierOverwrite = null;

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function findSimilarPlayerName(name){
  const target = name.toLowerCase();
  let best = null, bestDist = 999;
  players.forEach(p => {
    const candidate = p.name.toLowerCase();
    if(candidate === target) return;
    const dist = levenshtein(target, candidate);
    const threshold = candidate.length <= 4 ? 1 : 2;
    if(dist <= threshold && dist < bestDist){ best = p.name; bestDist = dist; }
  });
  return best;
}
// Same fuzzy "did you mean" matching as findSimilarPlayerName, but never
// suggests a banned player's name to a visitor doing a public search.
function findSimilarPublicPlayerName(name){
  const target = name.toLowerCase();
  let best = null, bestDist = 999;
  players.forEach(p => {
    if(p.banned) return;
    const candidate = p.name.toLowerCase();
    if(candidate === target) return;
    const dist = levenshtein(target, candidate);
    const threshold = candidate.length <= 4 ? 1 : 2;
    if(dist <= threshold && dist < bestDist){ best = p.name; bestDist = dist; }
  });
  return best;
}

  const name = document.getElementById('add-ign').value.trim();
  const region = document.getElementById('add-region').value;
  const country = document.getElementById('add-country').value;
  const kitId = document.getElementById('add-kit').value;
  const points = Number(document.getElementById('add-points').value) || 0;

  if(!name){ showToast('Enter an IGN'); return; }
  if(points < 1 || points > 60){ showToast('Points must be between 1 and 60'); return; }

  const kitLabel = (KITS.find(k => k.id === kitId) || {}).label || kitId;
  const p = players.find(x => x.name.toLowerCase() === name.toLowerCase());

  if(!p){
    const similar = findSimilarPlayerName(name);
    if(similar && !confirm(`This is close to an existing name, "${similar}". Add "${name}" as a new, separate player anyway?`)){
      return;
    }
  }

  if(p && p.banned){
    showToast(`${p.name} is banned — unban them before their tier can be updated`);
    return;
  }

  const match = pointsToTierSub(points);
  const kitEntry = { tier: match ? match.tier : "5", sub: match ? match.sub : "Low", points };

  if(p && p.kits && p.kits[kitId] && p.kits[kitId].tier){
    pendingTierOverwrite = { name, region, country, kitId, kitEntry };
    document.getElementById('tier-confirm-text').textContent = `${p.name} already has a tier set in ${kitLabel}. Overwrite it?`;
    document.getElementById('tier-confirm-bar').classList.add('show');
    return;
  }

  await applyTierEntry(name, region, country, kitId, kitEntry, adminIdentity);
  finishAdminTierForm();
}

function finishAdminTierForm(){
  const ignInput = document.getElementById('add-ign');
  const pointsInput = document.getElementById('add-points');
  if(ignInput) ignInput.value = '';
  if(pointsInput) pointsInput.value = '0';
  renderAdmin();
  renderBoard();
}

async function confirmPendingTier(proceed){
  document.getElementById('tier-confirm-bar').classList.remove('show');
  if(proceed && pendingTierOverwrite){
    const { name, region, country, kitId, kitEntry } = pendingTierOverwrite;
    await applyTierEntry(name, region, country, kitId, kitEntry, adminIdentity);
    finishAdminTierForm();
  }
  pendingTierOverwrite = null;
}

async function applyTierEntry(name, region, country, kitId, kitEntry, changedBy){
  let p = players.find(x => x.name.toLowerCase() === name.toLowerCase());
  if(p){
    const before = p.kits && p.kits[kitId] ? p.kits[kitId] : null;
    p.region = region;
    if(country !== undefined) p.country = country;
    p.kits = p.kits || {};
    p.kits[kitId] = kitEntry;
    recomputeTotal(p);
    await updatePlayer(p);
    const changed = (before ? `${before.tier}|${before.sub}|${before.points}` : null) !== `${kitEntry.tier}|${kitEntry.sub}|${kitEntry.points}`;
    let historyOk = true;
    if(changed){
      historyOk = await logTierHistory(p, kitId, before, kitEntry, changedBy);
    }
    if(historyOk) showToast('Tier updated');
  }else{
    p = {
      id: cryptoId(),
      name,
      region,
      country: country || '',
      tier: "5",
      sub: "Low",
      points: 0,
      kits: { [kitId]: kitEntry },
      banned: false,
      banReason: '',
    };
    recomputeTotal(p);
    players.push(p);
    await insertPlayer(p);
    const historyOk = await logTierHistory(p, kitId, null, kitEntry, changedBy);
    if(historyOk) showToast('Player created and tier added');
  }
}

/* ============ SITE STATS ============ */
let statsLoaded = false;
let statsData = null;
/* Scans the full tier_history table once and derives a handful of records
   from it: a per-player running points total (to find each player's
   all-time high), activity counts, and per-kit tier-change counts. */
async function fetchSiteStats(){
  if(!supabaseClient) return null;
  const { data, error } = await supabaseClient
    .from('tier_history')
    .select('player_id, player_name, kit, new_tier, new_sub, new_points, action, created_at')
    .order('created_at', { ascending: true });
  if(error || !data) return null;

  const kitPointsByPlayer = {};
  const maxTotalByPlayer = {};
  const activityCount = {};
  const kitChangeCount = {};
  const trendingKitCount = {};
  const perPlayerPerKitEvents = {};
  let tierChanges = 0, bans = 0, unbans = 0;
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;

  data.forEach(row => {
    if(!activityCount[row.player_id]) activityCount[row.player_id] = { name: row.player_name, count: 0 };
    activityCount[row.player_id].count++;

    if(row.action === 'ban'){ bans++; return; }
    if(row.action === 'unban'){ unbans++; return; }

    tierChanges++;
    if(row.kit) kitChangeCount[row.kit] = (kitChangeCount[row.kit] || 0) + 1;
    if(row.kit && new Date(row.created_at).getTime() >= sevenDaysAgo){
      trendingKitCount[row.kit] = (trendingKitCount[row.kit] || 0) + 1;
    }

    if(!kitPointsByPlayer[row.player_id]) kitPointsByPlayer[row.player_id] = {};
    if(row.kit) kitPointsByPlayer[row.player_id][row.kit] = Number(row.new_points) || 0;
    const total = Object.values(kitPointsByPlayer[row.player_id]).reduce((a, b) => a + b, 0);
    if(!maxTotalByPlayer[row.player_id] || total > maxTotalByPlayer[row.player_id].max){
      maxTotalByPlayer[row.player_id] = { name: row.player_name, max: total };
    }

    if(row.kit && row.new_tier){
      const key = `${row.player_id}::${row.kit}`;
      (perPlayerPerKitEvents[key] = perPlayerPerKitEvents[key] || { name: row.player_name, kit: row.kit, events: [] }).events.push(row);
    }
  });

  const mostActive = Object.values(activityCount).sort((a, b) => b.count - a.count)[0] || null;
  const highestEver = Object.values(maxTotalByPlayer).sort((a, b) => b.max - a.max)[0] || null;
  const topKitEntry = Object.entries(kitChangeCount).sort((a, b) => b[1] - a[1])[0] || null;
  const trendingKits = Object.entries(trendingKitCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const topNow = sortedPlayers(players.filter(p => !p.banned))[0] || null;

  let longestStreak = null;
  Object.values(perPlayerPerKitEvents).forEach(({ name, kit, events }) => {
    events.forEach((ev, i) => {
      if(ev.new_tier !== '1') return;
      const start = new Date(ev.created_at).getTime();
      const end = events[i + 1] ? new Date(events[i + 1].created_at).getTime() : Date.now();
      const dur = end - start;
      if(!longestStreak || dur > longestStreak.durationMs){
        longestStreak = { name, kit, durationMs: dur };
      }
    });
  });

  const regionCounts = {};
  players.forEach(p => { regionCounts[p.region] = (regionCounts[p.region] || 0) + 1; });

  // Weekly tier-change volume for the last 8 weeks — how many tier changes
  // landed each kit/player on Tier 1..5 that week. This is a trend of
  // *changes*, not a full historical snapshot of everyone's tier (that
  // would need reconstructing every player's state at each past moment),
  // but it's an honest, directly-sourced view of how the tier spread has
  // been shifting recently.
  const WEEKS = 8;
  const weekMs = 7 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const weeklyTierCounts = Array.from({ length: WEEKS }, (_, i) => {
    const weeksAgo = WEEKS - 1 - i;
    const end = now - weeksAgo * weekMs;
    const start = end - weekMs;
    return { start, end, counts: TIERS.map(() => 0) };
  });
  data.forEach(row => {
    if(row.action === 'ban' || row.action === 'unban') return;
    if(!row.new_tier) return;
    const t = new Date(row.created_at).getTime();
    const bucket = weeklyTierCounts.find(w => t >= w.start && t < w.end) || weeklyTierCounts[weeklyTierCounts.length - 1];
    const idx = TIERS.findIndex(tr => tr.id === row.new_tier);
    if(idx !== -1) bucket.counts[idx]++;
  });

  return {
    topNow,
    highestEver,
    tierChanges,
    bans,
    unbans,
    mostActive,
    topKit: topKitEntry ? { id: topKitEntry[0], count: topKitEntry[1] } : null,
    trendingKits: trendingKits.map(([id, count]) => ({ id, count })),
    longestStreak,
    regionCounts,
    totalPlayers: players.length,
    weeklyTierCounts,
  };
}

      ${sub ? `<div class="stat-tile-sub">${sub}</div>` : ''}
    </div>
  `;

  const sectionsHTML = {

          ${statTile('Total tier changes', s.tierChanges.toLocaleString())}

          ${statTile('Bans issued', s.bans.toLocaleString(), s.unbans ? `${s.unbans.toLocaleString()} unbanned since` : '')}
        </div>
      </div>
    `,
    tiers: tierDistributionHTML(s),
    trending: `
      <div class="info-card" style="max-width:960px;">
        <div class="info-card-head">

          <h2>Trending this week</h2>
        </div>
        <p>Kits with the most tier changes in the last 7 days.</p>
        ${s.trendingKits.length === 0 ? `<div class="empty">No activity in the last 7 days.</div>` : `
          <div class="stats-grid">
            ${s.trendingKits.map(t => statTile((KITS.find(k => k.id === t.id) || {}).label || t.id, t.count, 'changes this week')).join('')}
          </div>
        `}
      </div>
    `,
    region: `
      <div class="info-card" style="max-width:960px;">
        <div class="info-card-head">
          <div class="info-card-icon">🌍</div>
          <h2>Players by region</h2>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
          ${Object.entries(s.regionCounts || {}).sort((a,b) => b[1]-a[1]).map(([region, count]) => `
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:48px;font-size:12px;color:var(--text-dim);">${escapeHtml(region)}</div>
              <div style="flex:1;background:var(--surface);border-radius:6px;overflow:hidden;height:16px;">
                <div style="width:${Math.round((count / maxRegionCount) * 100)}%;height:100%;background:var(--diamond);"></div>
              </div>
              <div style="width:30px;font-size:12px;text-align:right;">${count}</div>

    `,
  };
  const order = (siteSettings.stats_section_order && siteSettings.stats_section_order.length === DEFAULT_STATS_ORDER.length)
    ? siteSettings.stats_section_order : DEFAULT_STATS_ORDER;
  view.innerHTML = order.map(key => sectionsHTML[key] || '').join('<div style="height:16px;"></div>');
  const recordsCard = document.getElementById('stats-records-card');
  (recordsCard ? recordsCard.querySelectorAll('.stat-tile') : []).forEach((el, i) => {
    const names = [s.topNow && s.topNow.name, s.highestEver && s.highestEver.name, s.mostActive && s.mostActive.name, null, s.longestStreak && s.longestStreak.name];
    const name = names[i];
    if(name){

/* Counts, per kit, how many currently-ranked (non-banned) players sit in
   each of the 5 tiers, and renders it as a small proportional bar per kit. */
function weeklyTierChartHTML(weeklyTierCounts){
  if(!weeklyTierCounts || !weeklyTierCounts.length) return '';
  const maxTotal = Math.max(1, ...weeklyTierCounts.map(w => w.counts.reduce((a,b) => a+b, 0)));
  const barW = 36, gap = 10, chartH = 90, pad = 4;
  const n = weeklyTierCounts.length;
  const svgW = n * (barW + gap) - gap;
  const bars = weeklyTierCounts.map((w, i) => {
    const total = w.counts.reduce((a,b) => a+b, 0);
    const x = i * (barW + gap);
    let yCursor = chartH - pad;
    const segs = w.counts.map((c, ti) => {
      if(c <= 0) return '';
      const segH = total === 0 ? 0 : (c / maxTotal) * (chartH - pad * 2);
      yCursor -= segH;
      return `<rect x="${x}" y="${yCursor.toFixed(1)}" width="${barW}" height="${segH.toFixed(1)}" fill="var(--tier${ti+1}-glow)"><title>${TIERS[ti].label}: ${c}</title></rect>`;
    }).join('');
    const label = new Date(w.end - 1).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `${segs}<text x="${x + barW/2}" y="${chartH + 14}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${label}</text>`;
  }).join('');
  return `
    <div class="tier-dist-over-time" style="margin-top:18px;">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">Tier changes by week (last ${n} weeks)</div>
      <svg viewBox="0 0 ${svgW} ${chartH + 22}" style="width:100%;max-width:520px;height:auto;">
        ${bars}
      </svg>
    </div>
  `;
}
function tierDistributionHTML(s){
  const rows = KITS.map(kit => {
    const counts = TIERS.map(() => 0);
    let total = 0;
    players.forEach(p => {
      if(p.banned) return;
      const entry = p.kits && p.kits[kit.id];
      if(!entry || !entry.tier) return;
      const idx = TIERS.findIndex(t => t.id === entry.tier);
      if(idx === -1) return;
      counts[idx]++;
      total++;
    });
    const bar = total === 0 ? `<div class="tier-dist-empty">No players ranked yet</div>` :
      TIERS.map((t, i) => counts[i] > 0 ? `<div class="tier-dist-seg" style="flex:${counts[i]}; background: var(--tier${i + 1}-glow);" title="${t.label}: ${counts[i]}"></div>` : '').join('');
    return `
      <div class="tier-dist-row">
        <div class="tier-dist-label">${escapeHtml(kit.label)}</div>
        <div class="tier-dist-bar">${bar}</div>
        <div class="tier-dist-total">${total}</div>
      </div>
    `;
  }).join('');
  const legend = TIERS.map((t, i) => `<span class="tier-dist-legend-item"><span class="tier-dist-dot" style="background:var(--tier${i + 1}-glow)"></span>${t.label}</span>`).join('');
  return `
    <div class="info-card" style="max-width:960px;">
      <div class="info-card-head">
        <div class="info-card-icon">📊</div>
        <h2>Tier distribution</h2>
      </div>
      <p>How ranked players are spread across tiers, per gamemode.</p>
      <div class="tier-dist-legend">${legend}</div>
      <div class="tier-dist-rows">${rows}</div>
      ${s ? weeklyTierChartHTML(s.weeklyTierCounts) : ''}
    </div>
  `;
}

/* ============ TABS ============ */
function showView(name, opts){
  opts = opts || {};
  if(name !== 'admin' && shouldGateForMaintenance()){
    renderMaintenancePage();
    name = 'maintenance';
  }
  currentView = name;
  const views = { board: 'view-board', admin: 'view-admin', info: 'view-info', recent: 'view-recent', stats: 'view-stats', notfound: 'view-404', maintenance: 'view-maintenance' };
  Object.entries(views).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if(key === name){
      el.style.display = '';
      el.classList.remove('anim-in');
      void el.offsetWidth;
      el.classList.add('anim-in');
    }else{
      el.style.display = 'none';
    }
  });
  document.getElementById('tab-board').classList.toggle('active', name === 'board');
  document.getElementById('tab-recent').classList.toggle('active', name === 'recent');
  document.getElementById('tab-stats').classList.toggle('active', name === 'stats');
  document.getElementById('tab-info').classList.toggle('active', name === 'info');
  document.getElementById('tab-admin-visible').classList.toggle('active', name === 'admin');
  if(!opts.skipUrlUpdate) updateUrlForState(opts.replace);
}
function syncAdminNav(){
  document.getElementById('tab-admin-visible').style.display = isAdmin ? '' : 'none';
}
document.getElementById('tab-board').addEventListener('click', () => showView('board'));
document.getElementById('brand-home-link').addEventListener('click', () => showView('board'));
document.getElementById('brand-home-link').addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showView('board'); }
});
document.getElementById('tab-recent').addEventListener('click', () => {
  recentLoaded = false;
  renderRecent();
  showView('recent');
});
document.getElementById('tab-stats').addEventListener('click', () => {
  statsLoaded = false;
  renderStats();
  showView('stats');
});
document.getElementById('tab-info').addEventListener('click', () => {
  renderInfo();
  showView('info');
});
document.getElementById('tab-admin-visible').addEventListener('click', () => { renderAdmin(); showView('admin'); });
document.getElementById('corner-admin-btn').addEventListener('click', () => { renderAdmin(); showView('admin'); });
document.getElementById('player-card-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'player-card-overlay') closePlayerCard();
});

/* ---------- swipe between gamemode tabs (mobile) ---------- */
(function setupGamemodeSwipe(){
  const boardEl = document.getElementById('view-board');
  let startX = null, startY = null, startTag = null;
  boardEl.addEventListener('touchstart', (e) => {
    if(currentView !== 'board' || window.innerWidth > 900 || !e.touches.length) return;
    startTag = e.target.tagName;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    if(startX === null) return;
    const wasBoard = currentView === 'board' && window.innerWidth <= 900;
    const ignoreTag = ['INPUT', 'SELECT', 'TEXTAREA'].includes(startTag);
    const t = e.changedTouches[0];
    const dx = t ? t.clientX - startX : 0;
    const dy = t ? t.clientY - startY : 0;
    startX = null; startY = null; startTag = null;
    if(!wasBoard || ignoreTag || !t) return;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const visible = visibleGamemodes();
    const idx = visible.findIndex(g => g.id === currentGamemode);
    if(idx === -1) return;
    const nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if(nextIdx < 0 || nextIdx >= visible.length) return;
    currentGamemode = visible[nextIdx].id;
    updateUrlForState();
    renderBoard();
  }, { passive: true });
})();

/* ============ INIT ============ */
(async function init(){
  const startPathRaw = stripBasePath(location.pathname).replace(/^\/+|\/+$/g, '');
  const startPath = startPathRaw.toLowerCase();
  const startIsPlayer = /^player\//i.test(startPathRaw);
  const startPlayerName = startIsPlayer ? decodeURIComponent(startPathRaw.slice(startPathRaw.indexOf('/') + 1)) : null;

  document.getElementById('view-board').innerHTML = skeletonBoardHTML();
  setLoadProgress(25);
  registerServiceWorker();
  await Promise.all([loadPlayers(), fetchSiteSettings()]);
  setLoadProgress(75);
  applyTaglineToDOM();
  applyAccentColorToDOM();
  applyFooterToDOM();
  applyVersionToDOM();
  updateStaleDataBanner();
  renderAnnouncementBanner();
  wireGlobalSearch();
  wireJumpToTop();
  wirePullToRefresh();
  logPageView(startPath || 'overall');

  // Resolve admin session BEFORE routing, so a logged-in admin loading any
  // URL while maintenance mode is on sees the real site, not the gate.
  if(supabaseClient){
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){
      isAdmin = true;
      adminEmail = (data.session.user && data.session.user.email) || '';
      adminIdentity = await resolveAdminIdentity(adminEmail);
      syncAdminNav();
      resetSessionTimeoutTimer();
    }
  }

  if(startIsPlayer){
    currentGamemode = 'overall';
    showView('board', { skipUrlUpdate: true });
    renderBoard();
    const p = findPlayerByName(startPlayerName);
    if(p) openPlayerCard(p, { skipUrlUpdate: true });
  }else if(startPath === 'info'){
    renderInfo();
    showView('info', { skipUrlUpdate: true });
  }else if(startPath === 'recent'){
    await renderRecent();
    showView('recent', { skipUrlUpdate: true });
  }else if(startPath === 'stats'){
    await renderStats();
    showView('stats', { skipUrlUpdate: true });
  }else if(startPath === 'admin'){
    renderAdmin();
    showView('admin', { skipUrlUpdate: true });
  }else if(startPath !== '' && !GAMEMODES.some(g => g.id === startPath)){
    render404();
    showView('notfound', { skipUrlUpdate: true });
  }else{
    currentGamemode = GAMEMODES.some(g => g.id === startPath) ? startPath : 'overall';
    applyRegionFromQuery(location.search);
    showView('board', { skipUrlUpdate: true });
    renderBoard();
  }

  updateUrlForState(true);
  finishLoadProgress();
})();
</script>
