<style>
  :root{
    /* This site is dark-only — it never follows the OS light/dark setting.
       Without telling the browser that, some mobile browsers (notably
       Android Chrome/WebView with the "Dark theme: web contents"
       accessibility setting on) assume the page is light-themed and
       apply their own heuristic re-theming to native form controls —
       text inputs, selects, date pickers — which can override our CSS
       and render them with a white background, black text and the
       system's default (serif) font, clashing badly with the rest of
       the page. Declaring color-scheme up front opts out of that. */
    color-scheme: dark;
    --bg: #121016;
    --bg-2: #17141c;
    --surface: #1e1a25;
    --surface-2: #262130;
    --border: #332c40;
    --text: #f1ede6;
    --text-dim: #a89fb3;
    --text-faint: #6f6680;
    --gold: #f2c14e;
    --emerald: #3fb876;
    --diamond: #63d6e8;
    --netherite: #b79bd6;
    --danger: #e0605a;

    --tier1-a: #d9c4f0; --tier1-b: #6c5a86; --tier1-glow: #a88bc9;
    --tier2-a: #b6f2fb; --tier2-b: #2d8fa3; --tier2-glow: #63d6e8;
    --tier3-a: #ffe9ad; --tier3-b: #a9781f; --tier3-glow: #f2c14e;
    --tier4-a: #eef0f2; --tier4-b: #83898f; --tier4-glow: #cfd3d6;
    --tier5-a: #cfcfd2; --tier5-b: #5c5c60; --tier5-glow: #8c8c8c;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #241d33 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, #1d2b2a 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-orbs{
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-orb{
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.16;
  }
  .bg-orb.orb-1{
    width: 480px; height: 480px;
    top: -120px; left: -100px;
    background: var(--netherite);
    animation: orbFloat1 22s ease-in-out infinite;
  }
  .bg-orb.orb-2{
    width: 420px; height: 420px;
    bottom: -140px; right: -80px;
    background: var(--diamond);
    animation: orbFloat2 26s ease-in-out infinite;
  }
  .bg-orb.orb-3{
    width: 340px; height: 340px;
    top: 40%; left: 60%;
    background: var(--gold);
    opacity: 0.08;
    animation: orbFloat3 30s ease-in-out infinite;
  }
  @keyframes orbFloat1{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes orbFloat2{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-50px, -60px) scale(1.1); }
  }
  @keyframes orbFloat3{
    0%, 100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-40px, 50px) scale(0.9); }
  }

  @keyframes fadeInUp{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }
  @keyframes scaleIn{
    from{ opacity: 0; transform: scale(0.94); }
    to{ opacity: 1; transform: scale(1); }
  }
  @keyframes shimmer{
    0%{ background-position: -300px 0; }
    100%{ background-position: 300px 0; }
  }
  @keyframes softPulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.6; }
  }
  @keyframes popIn{
    0%{ transform: scale(0.85); opacity: 0; }
    60%{ transform: scale(1.03); opacity: 1; }
    100%{ transform: scale(1); }
  }

  .anim-in{
    animation: fadeInUp .5s cubic-bezier(.2,.8,.2,1) both;
  }

  .eyebrow{
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }

  ::selection{ background: var(--diamond); color: #10131a; }

  a{ color: inherit; }

  /* ---------- shell ---------- */
  .shell{
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    animation: fadeIn .4s ease both;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand{
    display:flex;
    align-items:center;
    gap: 0px;
    cursor: pointer;
    border-radius: 10px;
    transition: opacity .15s ease;
  }
  .brand:hover{ opacity: 0.85; }
  .brand:focus-visible{ outline: 2px solid var(--diamond); outline-offset: 4px; }
  .brand-mark{
    width: 90px; height: 90px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 0 14px rgba(99,214,232,0.35)) brightness(1.15);
  }
  .brand-title-row{ display:flex; align-items:center; }
  .brand-text h1{
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .brand-text .eyebrow{ margin-top: 4px; font-size: 10px; }

  nav.tabs{
    display:flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }
  nav.tabs button{
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s ease;
  }
  nav.tabs button.active{
    background: var(--surface-2);
    color: var(--text);
  }
  nav.tabs button:hover:not(.active){ color: var(--text); }

  .nav-group{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  /* ---------- filter bar ---------- */
  .filters{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .filters select, .filters input{
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    outline: none;
  }
  .filters input{ min-width: 200px; flex: 1; }
  .filters select{ cursor: pointer; }
  .filters input:focus, .filters select:focus{ border-color: var(--diamond); }

  /* ---------- gamemode nav ---------- */
  .gamemode-nav{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .gm-pill{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .gm-pill-icon{
    width: 16px;
    height: 16px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .gm-pill:hover{ color: var(--text); border-color: var(--diamond); transform: translateY(-1px); }
  .gm-pill:active{ transform: translateY(0) scale(0.96); }
  .gm-pill.active{
    background: linear-gradient(135deg, rgba(99,214,232,0.18), rgba(183,155,214,0.18));
    color: var(--text);
    border-color: var(--diamond);
  }

  .kit-heading{ margin-bottom: 18px; }
  .kit-heading h2{ margin: 4px 0 0; font-size: 20px; font-weight: 800; }

  .tier-group{ margin-bottom: 16px; }
  .tier-group-head{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tier-group-material{
    font-size: 11px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  .player-chips{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .player-chip{
    display:flex;
    align-items:center;
    gap: 8px;
    background: var(--surface);

  /* ---------- podium ---------- */
  .podium{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .podium-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align:center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform .22s cubic-bezier(.2,.8,.2,1), border-color .22s ease, box-shadow .22s ease;
  }
  .podium-card:hover{
    border-color: var(--diamond);
    transform: translateY(-4px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(99,214,232,0.15);
  }
  .podium-card:active{ transform: translateY(-1px); }
  .podium-card.p1::after{
    content:'';
    position:absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.12) 45%, transparent 60%);
    background-size: 220% 220%;
    background-position: -120% -120%;
    animation: shineSweep 4.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes shineSweep{
    0%{ background-position: -120% -120%; opacity: 0; }
    8%{ opacity: 1; }
    50%{ background-position: 120% 120%; opacity: 1; }
    58%{ opacity: 0; }
    100%{ background-position: 120% 120%; opacity: 0; }
  }
  .flag-fade{
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 30%;
    background-size: cover;
    background-position: center;
    opacity: 0.28;
    -webkit-mask-image: linear-gradient(to right, black 45%, transparent 100%);
    mask-image: linear-gradient(to right, black 45%, transparent 100%);
    pointer-events: none;
  }
  .podium-flag-bg{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    pointer-events: none;
  }
  .podium-flag-overlay{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(30,26,37,0.45) 0%, rgba(30,26,37,0.8) 55%, rgba(30,26,37,0.94) 100%);
    pointer-events: none;
  }
  .podium-card::before{
    content:'';
    position:absolute; inset:0;
    opacity: .12;
    background: radial-gradient(circle at 50% -20%, var(--glow, var(--gold)), transparent 65%);
  }
  .podium-card.p1{ order:2; padding-top: 26px; border-color: #4d4260; --glow: var(--gold); }
  .podium-card.p2{ order:1; --glow: var(--tier4-glow); }
  .podium-card.p3{ order:3; --glow: #c88a5a; }
  .podium-rank{

  /* Global form control styling — without this, text inputs, selects,
     date/number fields, and checkboxes fall back to the browser's default
     (white) chrome even inside this dark theme. */
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
  select,
  textarea{
    color-scheme: dark;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    outline: none;
    accent-color: var(--diamond);
    transition: border-color .15s ease;
  }
  /* Text-like inputs only (not select — its native dropdown arrow and
     panel should stay; color-scheme above is enough to theme those dark).
     appearance:none here strips native chrome (e.g. the date-picker
     field's own background, number spinners) that can otherwise ignore
     our background/color and render with the browser's light UA style. */
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]){
    -webkit-appearance: none;
    appearance: none;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]):focus,
  select:focus,
  textarea:focus{
    border-color: var(--diamond);
  }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }
  select option{ background: var(--bg-2); color: var(--text); }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{
    filter: invert(0.85);
    cursor: pointer;
  }
  input[type="checkbox"]{
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg-2);
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    transition: background .15s ease, border-color .15s ease;
  }
  input[type="checkbox"]:hover{ border-color: var(--diamond); }
  input[type="checkbox"]:checked{
    background: var(--diamond);
    border-color: var(--diamond);
  }
  input[type="checkbox"]:checked::after{
    content: '';
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 9px;
    border: solid #10131a;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  input[type="checkbox"]:focus-visible{ box-shadow: 0 0 0 2px rgba(99,214,232,0.35); }

  /* ---------- loading skeletons ---------- */
  .skel{
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
    background-size: 400% 100%;
    animation: skel-shimmer 1.4s ease infinite;
    border-radius: 6px;
  }
  @keyframes skel-shimmer{
    0%{ background-position: 100% 50%; }
    100%{ background-position: 0 50%; }
  }
  .skel-podium{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
  }
  .skel-podium-card{ height: 150px; border-radius: 14px; }
  .skel-podium-card:nth-child(1){ align-self: end; height: 130px; }
  .skel-podium-card:nth-child(3){ align-self: end; height: 130px; }
  .skel-rows{ display: flex; flex-direction: column; gap: 8px; }
  .skel-row{ height: 44px; border-radius: 10px; }
  .skel-tiles{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .skel-tile{ height: 76px; border-radius: 12px; }
  .skel-bar{ height: 14px; border-radius: 4px; }

  @media (max-width: 720px){
    .podium{ grid-template-columns: 1fr; }
    .podium-card{ order: initial !important; }
    /* The loading skeleton for the podium used its own fixed 3-column grid
       (and the shorter-side-cards height trick that makes sense for a real
       3-up podium), so on a phone it stayed cramped into three slivers even
       though the real, loaded podium correctly stacks to one column below —
       a jarring flash of broken-looking layout right before the real content
       pops in. Collapse it the same way. */
    .skel-podium{ grid-template-columns: 1fr; gap: 10px; }
    .skel-podium-card{ height: 110px !important; align-self: stretch !important; }
    .board-row{ grid-template-columns: 36px 1fr 70px; }
    .board-row .cell-region{ display:none; }
    /* The admin sub-nav (Roster / Punishments / Activity Log / Settings)
       is a plain unwrapped flex row, sized for four pills side by side.
       On a narrow phone that no longer fits — the last pill (Settings)
       got pushed off the right edge of the screen with no way to reach
       it. Let the pills wrap into a 2x2 grid instead. */
    .admin-subnav{ flex-wrap: wrap; }
    .admin-subnav button{ flex: 1 1 calc(50% - 6px); }
    /* Row-based admin tables (roster, punishments, activity log, admin
       names, analytics) each carry their own multi-column grid template —
       some as a plain class, some as a two-class modifier (e.g. .roster-cols)
       which is MORE specific than a bare `.admin-row` rule and would
       otherwise win over this collapse-to-one-column override regardless of
       viewport width, since specificity isn't affected by media queries.
       !important sidesteps that: below this width every one of these rows
       always stacks to a single column, whatever modifier class it carries. */
    .form-grid, .admin-row, .punish-row, .confirm-row{ grid-template-columns: 1fr !important; }
    .admin-row.head, .punish-row.head, .confirm-row.head{ display:none; }
    .row-actions{ justify-content: flex-start; }

    /* Bottom tab bar: easier to reach with a thumb than a top nav. */
    .shell{ padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    nav.tabs{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      display: flex;
      justify-content: space-around;
      align-items: stretch;
      background: var(--surface);
      border: none;
      border-top: 1px solid var(--border);
      border-radius: 0;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -6px 18px rgba(0,0,0,0.28);
    }
    nav.tabs button{
      flex: 1;
      border-radius: 0;
      padding: 11px 4px;
      font-size: 10.5px;
      border-top: 2px solid transparent;
    }
    nav.tabs button.active{
      background: transparent;
      border-top-color: var(--diamond);
      color: var(--diamond);
    }
    #corner-admin-btn{ bottom: calc(76px + env(safe-area-inset-bottom, 0px) + 10px); }
  }

  }
  .settings-card > summary::-webkit-details-marker{ display:none; }
  .settings-card > summary::after{
    content: '▾';
    margin-left: auto;
    color: var(--text-faint);
    font-size: 11px;
    transition: transform .2s ease;
    flex-shrink: 0;
  }
  .settings-card:not([open]) > summary::after{ transform: rotate(-90deg); }
  .settings-card[open] > summary{ margin-bottom: 6px; }
  .settings-card-body{ padding-top: 8px; }
  .settings-card.wide{ grid-column: 1 / -1; }
  .made-by-card{
    grid-column: 1 / -1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    padding: 18px 22px;
  }
  .global-search-wrap{
    display: flex;
    align-items: center;
  }
  #global-search-input{
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    width: 160px;
    transition: width .18s ease, border-color .15s ease;
  }
  #global-search-input:focus{
    width: 220px;
    outline: none;
    border-color: var(--diamond);
  }
  #announcement-banner{
    max-width: 1080px;
    margin: 0 auto 18px;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--diamond);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text);
  }
  #announcement-banner .announcement-close{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 6px;
  }
  #stale-data-banner{
    max-width: 1080px;
    margin: 0 auto 18px;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(224,96,90,0.08);
    border: 1px solid var(--danger);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text);
  }
  #stale-data-banner strong{ color: var(--danger); }
  #pwa-install-banner{
    max-width: 1080px;
    margin: 0 auto 18px;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text);
  }
  #pwa-install-banner button.btn{ font-size: 12px; padding: 7px 12px; }
  #pwa-install-banner .pwa-dismiss{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 6px;
  }
  #load-progress-bar{
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, var(--diamond), var(--gold));
    z-index: 9999;
    transition: width .25s ease, opacity .3s ease;
    opacity: 1;
  }
  #load-progress-bar.done{ opacity: 0; }
  #jump-to-top-btn{
    position: fixed;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px) + 10px);
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    z-index: 40;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    transition: opacity .18s ease, transform .15s ease;
  }
  #jump-to-top-btn:hover{ transform: translateY(-2px); }
  @media (min-width: 721px){
    #jump-to-top-btn{ bottom: 24px; }
  }
  .site-footer-bar{
    max-width: 1080px;
    margin: 30px auto 10px;
    padding: 0 20px;
    text-align: center;
  }
  #site-footer-text{
    color: var(--text-faint);
    font-size: 12px;
    display: none;
  }
  #site-version-text{
    display: block;
    color: var(--text-faint);
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .made-by-link{
    display:inline-flex;
    align-items:center;
    gap: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    text-decoration: none;
    transition: color .18s ease, transform .18s ease, gap .18s ease;
  }
  .made-by-link .arrow{ transition: transform .18s ease; }
  .made-by-link:hover{ color: var(--diamond); }
  .made-by-link:hover .arrow{ transform: translateX(3px); }
  .points-table{
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .points-table th, .points-table td{
    text-align: center;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .points-table th{
    color: var(--text-faint);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .points-table td:first-child, .points-table th:first-child{ text-align: left; }
  .points-table tr:last-child td{ border-bottom: none; }
  .points-table tbody tr{ transition: background .15s ease, transform .15s ease; }
  .points-table tbody tr:hover{ background: rgba(255,255,255,0.035); }
  .points-table tbody tr:hover .title-badge, .points-table tbody tr:hover .title-dot{ filter: brightness(1.2); }

  .password-cell{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .kit-permission-list{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .kit-permission-item{
    display:inline-flex;
    align-items:center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 10px 5px 8px;
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
  }
  .kit-permission-item:hover{ border-color: var(--diamond); color: var(--text); }
  .kit-permission-item input{
    display: none;
  }
  .kit-permission-item .kit-permission-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    transition: all .15s ease;
  }
  .kit-permission-item.checked{
    color: var(--diamond);
    background: rgba(99,214,232,0.1);
    border-color: rgba(99,214,232,0.4);
  }
  .kit-permission-item.checked .kit-permission-dot{
    background: var(--diamond);
    box-shadow: 0 0 6px var(--diamond);
  }
  .trusted-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-faint);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 9px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .trusted-toggle-btn:hover{ border-color: var(--gold); color: var(--gold); }
  .trusted-toggle-btn.is-trusted{
    color: var(--gold);
    background: rgba(242,193,78,0.12);
    border-color: rgba(242,193,78,0.4);
  }
  .confirm-row{
    display:grid;
    gap: 10px;
    align-items:center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    transition: background .15s ease;
  }
  .confirm-row{ grid-template-columns: 1fr 0.8fr 1fr 0.7fr 0.7fr auto; }
  .confirm-row.recent-row{ grid-template-columns: 1fr 1fr 1.1fr 1.1fr 0.8fr 0.9fr; }
  .confirm-row:last-child{ border-bottom: none; }
  .confirm-row.head{
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--text-faint);
    background: var(--bg-2);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

</style>
</head>

<script>
/* ============ CONFIG ============ */
// Admin access now uses a real Supabase Auth account (created in your

// Fill these in from your Supabase project (Project Settings -> API).
// See the deployment guide for exact steps.
// This site is hosted at ollaloll.github.io/genghis-tiers/ (a GitHub Pages
// project site, not a custom domain), so every route, asset link and the
// service worker have to live under this path prefix instead of assuming
// the site owns the whole domain root.
const BASE_PATH = '/genghis-tiers';

const SUPABASE_URL = "https://gyoapcdpjruzirlkpmvq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3AXdi2AtOv0f2OES60rakA_7yld_-Fw";

const supabaseClient = (SUPABASE_URL.startsWith("http"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const TIERS = [
  { id: "1", label: "Tier 1", material: "Netherite" },
  { id: "2", label: "Tier 2", material: "Diamond" },
  { id: "3", label: "Tier 3", material: "Gold" },
  { id: "4", label: "Tier 4", material: "Iron" },
  { id: "5", label: "Tier 5", material: "Stone" },
];
const SUBS = ["High", "Mid", "Low"];

// Points awarded per tier/sub-tier for a single gamemode. Adjust these to
// rebalance scoring — every player's kit tier assignment maps to a point
// value here, and Overall points are the sum across all their kits.
// Every tier/sub combo must map to a unique point value — pointsToTierSub()
// picks the tier by finding the highest threshold a player's points clear,
// so two combos sharing a value would make that boundary ambiguous.
const TIER_POINTS = {
  "1|High": 60, "1|Mid": 50, "1|Low": 40,
  "2|High": 30, "2|Mid": 25, "2|Low": 20,
  "3|High": 18, "3|Mid": 15, "3|Low": 12,
  "4|High": 10, "4|Mid": 7,  "4|Low": 5,
  "5|High": 3,  "5|Mid": 2,  "5|Low": 1,
};
function kitPoints(tierId, sub){
  return TIER_POINTS[`${tierId}|${sub}`] || 0;
}
function recomputeTotal(p){

// renders flag emoji as plain two-letter text, not an actual flag).
function flagDataUri(code){
  const b64 = code && FLAG_SVG_B64[code];
  return b64 ? `data:image/svg+xml;base64,${b64}` : null;
}

  const c = COUNTRIES.find(c => c.code === code);

let players = [];
let isAdmin = false;
let adminIdentity = 'Admin';
let adminEmail = '';
let currentView = 'board';
let openPlayerId = null;
function findPlayerByName(name){
  if(!name) return null;
  const lower = name.toLowerCase();
  return players.find(p => p.name.toLowerCase() === lower) || null;
}
let configError = false;
let expandedKitPlayerId = null;
let adminSubView = 'roster';
let adminSearch = '';
let bulkSelectedIds = new Set();
let tierLogRows = [];
let tierLogLoaded = false;
let tierLogSearch = '';
let tierLogKitFilter = 'all';
let pendingRevertId = null;
let pendingLogDeleteId = null;
let recentRows = [];
let recentLoaded = false;

/* ============ STORAGE (Supabase) ============ */
async function loadPlayers(){
  if(!supabaseClient){ configError = true; players = []; return; }
  try{
    const { data, error } = await supabaseClient.from('players').select('*');
    if(error) throw error;
    players = (data || []).map(rowToPlayer);
    players.forEach(p => {
      Object.values(p.kits || {}).forEach(k => {
        if(typeof k.points !== 'number') k.points = kitPoints(k.tier, k.sub);
      });
      recomputeTotal(p);
    });
    isShowingStaleData = false;
    try{ localStorage.setItem('gt_players_cache', JSON.stringify(players)); }catch(e2){}
  }catch(e){
    console.error(e);
    let usedCache = false;
    try{
      const cached = localStorage.getItem('gt_players_cache');
      if(cached){ players = JSON.parse(cached); usedCache = true; }
    }catch(e3){}
    if(usedCache){
      isShowingStaleData = true;
    }else{
      showToast("Couldn't load players — check Supabase setup");
      players = [];
    }
  }
}
function rowToPlayer(row){
  return { id: row.id, name: row.name, region: row.region, tier: row.tier, sub: row.sub, points: row.points, kits: row.kits || {}, banned: !!row.banned, banReason: row.ban_reason || '', country: row.country || '', createdAt: row.created_at || null };
}
async function insertPlayer(p){
  const { error } = await supabaseClient.from('players').insert([{
    id: p.id, name: p.name, region: p.region, tier: p.tier, sub: p.sub, points: p.points,
    kits: p.kits || {}, banned: !!p.banned, ban_reason: p.banReason || '', country: p.country || '',
  }]);
  if(error){ console.error(error); showToast("Couldn't save — check Supabase setup"); }
}
async function updatePlayer(p){
  const { error } = await supabaseClient.from('players')
    .update({ name: p.name, region: p.region, tier: p.tier, sub: p.sub, points: p.points, kits: p.kits || {}, banned: !!p.banned, ban_reason: p.banReason || '', country: p.country || '' })
    .eq('id', p.id);
  if(error){ console.error(error); showToast("Couldn't save — check Supabase setup"); }
}
async function deletePlayerRow(id){
  const { error } = await supabaseClient.from('players').delete().eq('id', id);
  if(error){ console.error(error); showToast("Couldn't delete — check Supabase setup"); }
}
function cryptoId(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2));
}

/* ---- Admin display names ----
   Every admin logs in with their Supabase Auth email; admin_profiles maps
   that email to a friendlier display name shown across the site (Recent
   activity, Tier Log, and every future tier change) instead of the raw
   email address. Only OWNER_ADMIN_EMAIL can write to admin_profiles — this
   is also enforced server-side by that table's RLS policy, so this is a
   UI convenience, not the actual security boundary. */
const OWNER_ADMIN_EMAIL = 'ollaloll@outlook.com';
function isOwnerAdmin(){
  return isAdmin && adminEmail && adminEmail.toLowerCase() === OWNER_ADMIN_EMAIL.toLowerCase();
}
async function fetchAdminDisplayName(email){
  if(!supabaseClient || !email) return '';
  try{
    const { data, error } = await supabaseClient
      .from('admin_profiles')
      .select('display_name')
      .eq('email', email)
      .single();
    if(error || !data) return '';
    return data.display_name || '';
  }catch(e){
    return '';
  }
}

function visibleGamemodes(){
  const hidden = siteSettings.hidden_kits || [];
  const base = GAMEMODES.filter(g => g.id === 'overall' || !hidden.includes(g.id));
  const order = siteSettings.kit_order || [];
  if(!order.length) return base;
  const overall = base.find(g => g.id === 'overall');
  const rest = base.filter(g => g.id !== 'overall');
  rest.sort((a, b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    const aRank = ai === -1 ? 999 : ai;
    const bRank = bi === -1 ? 999 : bi;
    return aRank - bRank;
  });
  return overall ? [overall, ...rest] : rest;
}

/* ---- Pull-to-refresh (mobile) ----
   Lets a visitor pull down from the top of the leaderboard to re-fetch the
   latest players, mirroring the native app gesture. Only engages when the
   board is already scrolled to the very top. */
function wirePullToRefresh(){
  const el = document.getElementById('view-board');
  if(!el || !('ontouchstart' in window)) return;
  let startY = null, pulling = false, indicator = null;
  el.addEventListener('touchstart', (e) => {
    if(window.scrollY > 4) { startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy > 8 && window.scrollY <= 4){
      pulling = true;
      if(!indicator){
        indicator = document.createElement('div');
        indicator.id = 'pull-refresh-indicator';
        indicator.style.cssText = 'text-align:center;padding:10px;font-size:12px;color:var(--text-dim);';
        indicator.textContent = dy > 70 ? 'Release to refresh…' : 'Pull to refresh…';
        el.prepend(indicator);
      }else{
        indicator.textContent = dy > 70 ? 'Release to refresh…' : 'Pull to refresh…';
      }
    }
  }, { passive: true });
  el.addEventListener('touchend', async (e) => {
    if(pulling && indicator){
      const released = indicator.textContent.indexOf('Release') === 0;
      indicator.remove();
      indicator = null;
      if(released){
        showToast('Refreshing…');
        await loadPlayers();
        updateStaleDataBanner();
        renderBoard();
      }
    }
    startY = null;
    pulling = false;
  }, { passive: true });
}

function wireGlobalSearch(){
  const input = document.getElementById('global-search-input');

    const q = input.value.trim().toLowerCase();

    // Banned players never appear in the autocomplete suggestions — only an
    // exact full-name match (handled below) can reveal a banned profile.
    const matches = players.filter(p => !p.banned && p.name.toLowerCase().includes(q)).slice(0, 8);
    list.innerHTML = matches.map(p => `<option value="${escapeAttr(p.name)}"></option>`).join('');

    if(e.key !== 'Enter') return;
    const name = input.value.trim();

    if(p){
      input.value = '';
      list.innerHTML = '';
      currentGamemode = 'overall';
      showView('board');
      renderBoard();
      openPlayerCard(p);
    }else{
      const suggestion = findSimilarPublicPlayerName(name);
      if(suggestion){
        showToast(`No player named "${name}" — did you mean "${suggestion}"? Press Enter to view.`);
        input.value = suggestion;
        input.select();
      }else{
        showToast(`No player named "${name}"`);

    }
  });

/* ---- Player share card (downloadable PNG) ---- */
function generateShareCardPNG(p, rank){
  const W = 800, H = 450;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--diamond').trim() || DEFAULT_ACCENT;

  // Background
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#121016');
  grad.addColorStop(1, '#1e1a25');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  ctx.strokeRect(6, 6, W - 12, H - 12);

  ctx.fillStyle = accent;
  ctx.font = '600 16px sans-serif';
  ctx.fillText('GENGHIS TIERS', 40, 50);

  ctx.fillStyle = '#f1ede6';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillText(p.name, 40, 130);

  ctx.fillStyle = '#a79fb0';
  ctx.font = '20px sans-serif';
  ctx.fillText(rank ? `#${rank} Overall · ${p.region}` : p.region, 40, 165);

  ctx.fillStyle = accent;
  ctx.font = 'bold 64px sans-serif';
  ctx.fillText(`${p.points.toLocaleString()} pts`, 40, 250);

  const title = getTitle(p.points);
  ctx.fillStyle = title.color;
  ctx.font = '600 20px sans-serif';
  ctx.fillText(title.label, 40, 290);

  let x = 40, y = 340;
  ctx.font = '14px sans-serif';
  KITS.forEach(k => {
    const entry = p.kits && p.kits[k.id];
    if(!entry || !entry.tier) return;
    const meta = tierMeta(entry.tier);
    const label = `${entry.sub ? entry.sub[0] : ''}${meta.label.replace('Tier ','T')}`;
    const text = `${k.label}: ${label}`;
    const w = ctx.measureText(text).width + 20;
    if(x + w > W - 40){ x = 40; y += 30; }
    if(y > H - 30) return;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y - 18, w - 8, 24);
    ctx.fillStyle = '#f1ede6';
    ctx.fillText(text, x + 6, y);
    x += w;
  });

  ctx.fillStyle = '#6d6578';
  ctx.font = '12px sans-serif';
  ctx.fillText(`${location.origin}${BASE_PATH}/player/${p.name}`, 40, H - 24);

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${p.name}-genghis-tiers.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
}

function toLocalDatetimeValue(iso){

function withFocusPreserved(renderFn){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  renderFn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// Combat titles awarded based on a player's total (Overall) points.
const TITLES = [
  { min: 400, label: "Combat Grandmaster", color: "#fff3c4" },
  { min: 250, label: "Combat Master", color: "#f2c14e" },
  { min: 100, label: "Combat Ace", color: "#e0605a" },
  { min: 50,  label: "Combat Specialist", color: "#b79bd6" },
  { min: 20,  label: "Combat Cadet", color: "#63d6e8" },
  { min: 10,  label: "Combat Novice", color: "#7a8ce0" },
  { min: 0,   label: "Rookie", color: "#8b8698" },
];
function getTitle(points){
  return TITLES.find(t => points >= t.min) || TITLES[TITLES.length - 1];
}
function titleBadgeHTML(points){
  const t = getTitle(points);
  return `<span class="title-badge" style="--title-color:${t.color}"><span class="title-dot"></span>${t.label}</span>`;
}
function sortedPlayers(list){
  const rule = (siteSettings && siteSettings.tie_break) || 'points';
  return [...list].sort((a,b) => {
    if(b.points !== a.points) return b.points - a.points;
    if(rule === 'alpha') return a.name.localeCompare(b.name);
    if(rule === 'joined'){
      const at = a.createdAt ? new Date(a.createdAt).getTime() : 0;
      const bt = b.createdAt ? new Date(b.createdAt).getTime() : 0;
      return at - bt; // earliest-joined first
    }
    return 0;
  });
}
function tierBadgeInner(tierId, sub, retired){
  const m = tierMeta(tierId);
  return `<span class="tier-swatch"></span>${retired ? 'R' : ''}${sub ? sub[0] : ''}${m.label.replace('Tier ','T')}`;
}
function tierBadge(tierId, sub, retired){
  const m = tierMeta(tierId);
  return `<span class="tier-badge" data-tier="${m.id}">${tierBadgeInner(tierId, sub, retired)}</span>`;
}
/* A "Peak" badge: shown instead of the normal tier badge when a player has
   ever held a higher tier than they currently sit at, in that kit. Displays
   a "P" + their best-ever tier by default; hovering, focusing, or clicking
   it flips to their current tier (and back on mouseleave/blur/click again). */
function peakTierBadge(peakTierId, peakSub, currentTierId, currentSub, retired){
  const pm = tierMeta(peakTierId);
  return `<span class="tier-badge peak-badge" data-tier="${pm.id}" data-showing="peak"
    data-peak-tier="${peakTierId}" data-peak-sub="${peakSub || ''}"
    data-current-tier="${currentTierId}" data-current-sub="${currentSub || ''}" data-retired="${retired ? '1' : ''}"
    tabindex="0" title="Peak tier — hover, focus, or click to see their current tier">P${tierBadgeInner(peakTierId, peakSub, false)}</span>`;
}
function togglePeakBadge(el, showCurrent){
  const next = showCurrent ? 'current' : 'peak';
  if(el.getAttribute('data-showing') === next) return;
  el.setAttribute('data-showing', next);
  if(showCurrent){
    const tierId = el.getAttribute('data-current-tier');
    el.setAttribute('data-tier', tierId);
    el.innerHTML = tierBadgeInner(tierId, el.getAttribute('data-current-sub'), el.getAttribute('data-retired') === '1');
  }else{
    const tierId = el.getAttribute('data-peak-tier');
    el.setAttribute('data-tier', tierId);
    el.innerHTML = 'P' + tierBadgeInner(tierId, el.getAttribute('data-peak-sub'), false);
  }
}
function updatePeakBadgeDisplay(el){
  const show = el.dataset.hovering === '1' || el.dataset.focused === '1' || el.dataset.pinned === '1';
  togglePeakBadge(el, show);
}
function wirePeakBadges(container){
  if(!container) return;
  // "Pinned" (click) is tracked separately from hover/focus so a click that
  // immediately follows a hover (as on a mouse) doesn't just toggle straight
  // back to peak — it stays showing the current tier until clicked again.
  container.querySelectorAll('.peak-badge').forEach(el => {
    el.addEventListener('mouseenter', () => { el.dataset.hovering = '1'; updatePeakBadgeDisplay(el); });
    el.addEventListener('mouseleave', () => { el.dataset.hovering = ''; updatePeakBadgeDisplay(el); });
    el.addEventListener('focus', () => { el.dataset.focused = '1'; updatePeakBadgeDisplay(el); });
    el.addEventListener('blur', () => { el.dataset.focused = ''; updatePeakBadgeDisplay(el); });
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.dataset.pinned = el.dataset.pinned === '1' ? '' : '1';
      updatePeakBadgeDisplay(el);
    });
  });
}
function regionBadge(region){
  return `<span class="region-badge" data-region="${region}">${region}</span>`;
}

function playerCardKitsHTML(p, tierSince, peakByKit){
  const kits = p.kits || {};
  const entries = KITS.filter(k => kits[k.id] && kits[k.id].tier);
  if(entries.length === 0){
    return `<span class="kit-chip-empty">No gamemode tiers set yet</span>`;
  }
  return entries.map(k => {
    const entry = kits[k.id];
    const since = tierSince && tierSince[k.id];
    const sinceHTML = since ? `<span class="kit-chip-since">${formatDurationDays(Date.now() - new Date(since).getTime())} in tier</span>` : '';
    const peak = peakByKit && peakByKit[k.id];
    const currentTierNum = parseInt(entry.tier, 10);
    const badge = (peak && peak.tierNum < currentTierNum)
      ? peakTierBadge(peak.tier, peak.sub, entry.tier, entry.sub, entry.retired)
      : tierBadge(entry.tier, entry.sub, entry.retired);
    return `<span class="kit-chip">
      <span class="kit-chip-label">${k.label}</span>
      <span class="kit-chip-tier-line">${badge}<span class="kit-chip-points">${entry.points} pts</span></span>
      ${sinceHTML}
    </span>`;
  }).join('');
}
function formatDurationDays(ms){
  if(!ms || ms < 0) return 'Today';
  const days = Math.floor(ms / 86400000);
  if(days <= 0) return 'Today';
  if(days === 1) return '1 day';
  if(days < 30) return `${days} days`;
  const months = Math.floor(days / 30);
  if(months < 12) return `${months} month${months > 1 ? 's' : ''}`;
  const years = Math.floor(days / 365);
  return `${years} year${years > 1 ? 's' : ''}`;
}
function formatJoinDate(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
// True if a player joined within the last 7 days — drives the "NEW" badge.
function isNewPlayer(p){
  if(!p || !p.createdAt) return false;
  return (Date.now() - new Date(p.createdAt).getTime()) < 7 * 24 * 60 * 60 * 1000;
}

function nearbyOverallHTML(p){

/* Scans a player's full tier_change history (all kits) to compute career
   stats: the best tier they've ever reached, the longest continuous run
   spent at Tier 1 in any single kit, and when they last moved into their
   current tier per kit (used for the "time in tier" indicator). */
async function fetchPlayerCareerStats(playerId){
  if(!supabaseClient) return null;
  const { data, error } = await supabaseClient
    .from('tier_history')
    .select('kit, new_tier, new_sub, created_at, action')
    .eq('player_id', playerId)
    .eq('action', 'tier_change')
    .order('created_at', { ascending: true });
  if(error || !data) return null;
  const perKit = {};
  data.forEach(row => {
    if(!row.kit || !row.new_tier) return;
    (perKit[row.kit] = perKit[row.kit] || []).push(row);
  });
  let peak = null;
  let longestMs = 0;
  let longestKit = null;
  const currentTierSince = {};
  const peakByKit = {};
  Object.entries(perKit).forEach(([kitId, events]) => {
    events.forEach((ev, i) => {
      const tierNum = parseInt(ev.new_tier, 10);
      if(!peak || tierNum < peak.tierNum){
        peak = { tierNum, tier: ev.new_tier, sub: ev.new_sub, kit: kitId };
      }
      if(!peakByKit[kitId] || tierNum < peakByKit[kitId].tierNum){
        peakByKit[kitId] = { tierNum, tier: ev.new_tier, sub: ev.new_sub };
      }
      if(ev.new_tier === '1'){
        const start = new Date(ev.created_at).getTime();
        const end = events[i + 1] ? new Date(events[i + 1].created_at).getTime() : Date.now();
        const dur = end - start;
        if(dur > longestMs){ longestMs = dur; longestKit = kitId; }
      }
    });
    currentTierSince[kitId] = events[events.length - 1].created_at;
  });
  return { peak, longestMs, longestKit, currentTierSince, peakByKit };
}

/* Reconstructs a player's total-points-over-time series from tier_history:
   each tier_change row tells us that kit's points after the change, so we
   keep a running per-kit total and sum it after every event in chronological
   order to get the overall total at that point in time. */
async function fetchPlayerPointsSeries(playerId){
  if(!supabaseClient) return [];
  const { data, error } = await supabaseClient
    .from('tier_history')
    .select('kit, new_points, action, created_at')
    .eq('player_id', playerId)
    .eq('action', 'tier_change')
    .order('created_at', { ascending: true });
  if(error || !data) return [];
  const kitPoints = {};
  const series = [];
  data.forEach(row => {
    if(!row.kit) return;
    kitPoints[row.kit] = Number(row.new_points) || 0;
    const total = Object.values(kitPoints).reduce((a, b) => a + b, 0);
    series.push({ t: row.created_at, total });
  });
  return series;
}
function pointsGraphHTML(series){
  if(series.length < 2){
    return `<div class="hint" style="margin:0;">Not enough history yet for a graph.</div>`;
  }
  const w = 400, h = 64, pad = 6;
  const values = series.map(s => s.total);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (values.length - 1);
  const coords = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [Number(x.toFixed(1)), Number(y.toFixed(1))];
  });
  const linePoints = coords.map(c => c.join(',')).join(' ');
  const areaPoints = `${pad},${h - pad} ${linePoints} ${w - pad},${h - pad}`;
  const trendUp = values[values.length - 1] >= values[0];
  const stroke = trendUp ? 'var(--emerald)' : 'var(--danger)';
  const fill = trendUp ? 'rgba(63,184,118,0.15)' : 'rgba(224,96,90,0.15)';
  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="points-sparkline">
      <polyline points="${areaPoints}" fill="${fill}" stroke="none"></polyline>
      <polyline points="${linePoints}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
    <div class="points-sparkline-range"><span>${values[0].toLocaleString()} pts</span><span>${values[values.length - 1].toLocaleString()} pts</span></div>
  `;
}
function historyTableHTML(rows){
  const body = rows.map(h => {
    const kitLabel = (KITS.find(k => k.id === h.kit) || {}).label || h.kit;
    const date = new Date(h.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const oldBadge = h.old_tier ? `${tierBadge(h.old_tier, h.old_sub)}<span class="kit-chip-points">${h.old_points} pts</span>` : `<span class="kit-chip-empty">Unranked</span>`;
    const newBadge = h.new_tier ? `${tierBadge(h.new_tier, h.new_sub)}<span class="kit-chip-points">${h.new_points} pts</span>` : `<span class="kit-chip-empty">Unranked</span>`;
    return `
      <tr>
        <td>${kitLabel}</td>
        <td><div class="history-change-cell">${oldBadge}<span class="history-arrow">→</span>${newBadge}</div></td>
        <td>${date}</td>
      </tr>`;
  }).join('');
  return `
    <table class="points-table history-table">
      <thead><tr><th>Kit</th><th>Change</th><th>Date</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

/* ============ LEADERBOARD VIEW ============ */
let boardFilters = { region: 'all', tier: 'all', search: '' };
let currentGamemode = 'overall';

/* Every page gets its own URL — /overall, /sword, /axe, ... for the leaderboard
   tabs, plus /info and /admin — so any page can be linked to directly and the
   browser back/forward buttons work. */
function currentPath(){
  if(openPlayerId){
    const p = players.find(x => x.id === openPlayerId);
    if(p) return '/player/' + encodeURIComponent(p.name);
  }
  if(currentView === 'info') return '/info';
  if(currentView === 'recent') return '/recent';
  if(currentView === 'stats') return '/stats';
  if(currentView === 'admin') return '/admin';
  return '/' + currentGamemode;
}
/* A region filter on the board rides along as a ?region= query param so a
   filtered leaderboard (e.g. EU only) can be linked to directly. */
function currentQuery(){
  if(!openPlayerId && currentView === 'board' && boardFilters.region !== 'all'){
    return '?region=' + encodeURIComponent(boardFilters.region.toLowerCase());
  }
  return '';
}
function updateUrlForState(replace){
  const path = BASE_PATH + currentPath() + currentQuery();
  if(location.pathname + location.search !== path){
    if(replace) history.replaceState({}, '', path);
    else history.pushState({}, '', path);
  }
}
function applyRegionFromQuery(search){
  const params = new URLSearchParams(search);
  const region = (params.get('region') || '').toUpperCase();
  boardFilters.region = REGIONS.includes(region) ? region : 'all';
}
// Strips the GitHub Pages BASE_PATH prefix off a pathname before the
// router looks at it, so the rest of the routing logic can keep working
// with plain root-relative routes like "overall" or "player/Name".
function stripBasePath(pathname){
  if(BASE_PATH && pathname.startsWith(BASE_PATH)) return pathname.slice(BASE_PATH.length) || '/';
  return pathname;
}
function applyPathToState(){
  const raw = stripBasePath(location.pathname).replace(/^\/+|\/+$/g, '');
  if(/^player\//i.test(raw)){
    const name = decodeURIComponent(raw.slice(raw.indexOf('/') + 1));
    const p = findPlayerByName(name);
    currentGamemode = 'overall';
    showView('board', { skipUrlUpdate: true });
    renderBoard();
    if(p) openPlayerCard(p, { skipUrlUpdate: true });
    return;
  }
  const lower = raw.toLowerCase();
  if(lower === 'info'){
    renderInfo();
    showView('info', { skipUrlUpdate: true });
  }else if(lower === 'recent'){
    renderRecent();
    showView('recent', { skipUrlUpdate: true });
  }else if(lower === 'stats'){
    renderStats();
    showView('stats', { skipUrlUpdate: true });
  }else if(lower === 'admin'){
    renderAdmin();
    showView('admin', { skipUrlUpdate: true });
  }else if(lower === '' || GAMEMODES.some(g => g.id === lower)){
    currentGamemode = lower === '' ? 'overall' : lower;
    applyRegionFromQuery(location.search);
    showView('board', { skipUrlUpdate: true });
    renderBoard();
  }else{
    render404();
    showView('notfound', { skipUrlUpdate: true });
  }
}
window.addEventListener('popstate', applyPathToState);

  const content = document.getElementById('gm-content');
  if(currentGamemode === 'overall'){
    content.innerHTML = renderOverallBoard();
  }else{
    content.innerHTML = renderKitBoard(currentGamemode);
  }
  document.getElementById('f-search').addEventListener('input', e => { boardFilters.search = e.target.value; withFocusPreserved(renderBoard); });
  document.getElementById('f-region').addEventListener('change', e => { boardFilters.region = e.target.value; updateUrlForState(); renderBoard(); });

  content.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', () => {
      const p = players.find(x => x.id === el.getAttribute('data-id'));
      if(p) openPlayerCard(p);
    });
  });

  if(currentGamemode === 'overall'){
    content.querySelectorAll('.mover-row[data-id]').forEach(el => {
      el.addEventListener('click', () => {
        const p = players.find(x => x.id === el.getAttribute('data-id'));
        if(p) openPlayerCard(p);
      });
    });
    if(!moversLoaded){
      loadMoversIfNeeded().then(() => {
        if(currentView === 'board' && currentGamemode === 'overall'){
          const widget = document.getElementById('movers-widget');
          if(widget) widget.outerHTML = `<div id="movers-widget">${moversWidgetHTML()}</div>`;
          document.querySelectorAll('.mover-row[data-id]').forEach(el => {
            el.addEventListener('click', () => {
              const p = players.find(x => x.id === el.getAttribute('data-id'));
              if(p) openPlayerCard(p);
            });
          });
        }
      });
    }
  }
}

let moversLoaded = false;
let moversRows = [];
async function loadMoversIfNeeded(){
  if(moversLoaded) return;
  moversRows = await fetchWeeklyMovers();
  moversLoaded = true;
}
/* Sums each player's net point change (across all kits) from tier_change
   rows logged in the last 7 days, to surface who's climbing or sliding. */
async function fetchWeeklyMovers(){
  if(!supabaseClient) return [];
  const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
  const { data, error } = await supabaseClient
    .from('tier_history')
    .select('player_id, player_name, old_points, new_points, action, created_at')
    .eq('action', 'tier_change')
    .gte('created_at', since);
  if(error || !data) return [];
  const deltas = {};
  data.forEach(row => {
    const delta = (row.new_points || 0) - (row.old_points || 0);
    if(!deltas[row.player_id]) deltas[row.player_id] = { id: row.player_id, name: row.player_name, delta: 0 };
    deltas[row.player_id].delta += delta;
  });
  return Object.values(deltas)
    .filter(m => m.delta !== 0)
    .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
}
function moversWidgetHTML(){
  if(!moversLoaded){
    return `<div class="movers-widget"><div class="movers-widget-head">📈 This week's movers</div><div class="hint" style="margin:0;">Loading…</div></div>`;
  }
  if(moversRows.length === 0){
    return `<div class="movers-widget"><div class="movers-widget-head">📈 This week's movers</div><div class="hint" style="margin:0;">No tier changes in the last 7 days.</div></div>`;
  }
  const gainers = moversRows.filter(m => m.delta > 0).slice(0, 3);
  const losers = moversRows.filter(m => m.delta < 0).slice(0, 3);
  const row = m => `<div class="mover-row" data-id="${m.id}"><span class="mover-name">${escapeHtml(m.name)}</span><span class="mover-delta ${m.delta > 0 ? 'up' : 'down'}">${m.delta > 0 ? '+' : ''}${m.delta.toLocaleString()} pts</span></div>`;
  return `
    <div class="movers-widget">
      <div class="movers-widget-head">📈 This week's movers</div>
      <div class="movers-cols">
        <div class="movers-col">
          <div class="movers-col-label">Gainers</div>
          ${gainers.length ? gainers.map(row).join('') : `<div class="hint" style="margin:0;">—</div>`}
        </div>
        <div class="movers-col">
          <div class="movers-col-label">Losers</div>
          ${losers.length ? losers.map(row).join('') : `<div class="hint" style="margin:0;">—</div>`}
        </div>
      </div>
    </div>
  `;
}

function renderKitBoard(kitId){
  const kit = KITS.find(k => k.id === kitId);
  const ranked = players
    .filter(p => !p.banned)
    .filter(p => p.kits && p.kits[kitId] && p.kits[kitId].tier)
    .filter(p => boardFilters.region === 'all' || p.region === boardFilters.region)
    .filter(p => !boardFilters.search || p.name.toLowerCase().includes(boardFilters.search.toLowerCase()));

  const groups = [];
  TIERS.forEach(t => {
    SUBS.forEach(sub => {
      const members = ranked.filter(p => p.kits[kitId].tier === t.id && p.kits[kitId].sub === sub)
        .sort((a,b) => a.name.localeCompare(b.name));
      if(members.length) groups.push({ tier: t, sub, members });
    });
  });

  return `
    <div class="filters">
      <input id="f-search" type="text" placeholder="Search a player..." value="${escapeAttr(boardFilters.search)}">
      <select id="f-region">
        <option value="all">All regions</option>
        ${REGIONS.map(r => `<option value="${r}" ${boardFilters.region===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
    <div class="kit-heading">
      <div class="eyebrow">GAMEMODE</div>
      <h2>${kit.label}</h2>
    </div>
    ${groups.length === 0 ? `<div class="empty">No players ranked in ${escapeHtml(kit.label)} yet.</div>` :
      groups.map(g => `
        <div class="tier-group">
          <div class="tier-group-head">
            <span class="tier-badge" data-tier="${g.tier.id}"><span class="tier-swatch"></span>${g.sub[0]}${g.tier.label.replace('Tier ','T')}</span>
            <span class="tier-group-material">${g.sub}</span>
          </div>
          <div class="player-chips">
            ${g.members.map(p => `
              <div class="player-chip" data-id="${p.id}">
                <span class="chip-name">${p.kits[kitId].retired ? '<span class="retired-tag">R</span>' : ''}${escapeHtml(p.name)}${isNewPlayer(p) ? '<span class="new-player-badge">NEW</span>' : ''}</span>
                ${regionBadge(p.region)}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')
    }
  `;
}

function loginLockoutState(){
  try{
    const raw = localStorage.getItem('gt_login_lockout');
    if(!raw) return { attempts: 0, lockedUntil: 0 };
    return JSON.parse(raw);
  }catch(e){ return { attempts: 0, lockedUntil: 0 }; }
}
function saveLoginLockoutState(state){
  try{ localStorage.setItem('gt_login_lockout', JSON.stringify(state)); }catch(e){}
}
function renderAdminGate(){
  const view = document.getElementById('view-admin');
  const lockState = loginLockoutState();
  const now = Date.now();
  const isLocked = lockState.lockedUntil && lockState.lockedUntil > now;
  if(isLocked){
    const minsLeft = Math.ceil((lockState.lockedUntil - now) / 60000);
    view.innerHTML = `
      <div class="gate">
        <div class="eyebrow">RESTRICTED</div>
        <h2>Admin access</h2>
        <p>Too many failed attempts. Try again in about ${minsLeft} minute${minsLeft===1?'':'s'}.</p>
      </div>
    `;
    return;
  }
  view.innerHTML = `
    <div class="gate">
      <div class="eyebrow">RESTRICTED</div>
      <h2>Admin access</h2>
      <p>Log in with your admin account to edit the tier list.</p>
      <input id="admin-email" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:10px;">
      <input id="admin-password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="unlock-btn" style="margin-top:12px;">Log in</button>
      <div class="err" id="gate-err"></div>
    </div>
  `;
  const tryUnlock = async () => {
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;
    document.getElementById('gate-err').textContent = '';
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      console.error(error);
      const state = loginLockoutState();
      state.attempts = (state.attempts || 0) + 1;
      const maxAttempts = siteSettings.login_lockout_attempts || 5;
      const lockoutMinutes = siteSettings.login_lockout_minutes || 5;
      if(state.attempts >= maxAttempts){
        state.lockedUntil = Date.now() + lockoutMinutes * 60000;
        state.attempts = 0;
        saveLoginLockoutState(state);
        renderAdminGate();
        return;
      }
      saveLoginLockoutState(state);
      document.getElementById('gate-err').textContent = error.message || 'Login failed.';
      return;
    }
    saveLoginLockoutState({ attempts: 0, lockedUntil: 0 });
    isAdmin = true;
    adminEmail = (data && data.user && data.user.email) || email || '';
    adminIdentity = await resolveAdminIdentity(adminEmail);
    syncAdminNav();
    resetSessionTimeoutTimer();
    renderAdmin();
  };
  document.getElementById('unlock-btn').addEventListener('click', tryUnlock);
  document.getElementById('admin-password').addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
}

  if(!isAdmin){ renderAdminGate(); return; }
  const view = document.getElementById('view-admin');

  view.innerHTML = `

    adminIdentity = 'Admin';

  checkSupabaseStatus().then(ok => {
    const pill = document.getElementById('db-status-pill');
    if(!pill) return;
    pill.textContent = ok ? 'DB: Connected' : 'DB: Error';
    pill.style.color = ok ? 'var(--emerald)' : 'var(--danger)';
    pill.style.background = ok ? 'rgba(63,184,118,0.12)' : 'rgba(224,96,90,0.12)';
    pill.style.border = `1px solid ${ok ? 'rgba(63,184,118,0.4)' : 'rgba(224,96,90,0.4)'}`;
  });
  document.getElementById('subnav-roster').addEventListener('click', () => { adminSubView = 'roster'; renderAdmin(); });
  document.getElementById('subnav-punish').addEventListener('click', () => { adminSubView = 'punish'; renderAdmin(); });
  document.getElementById('subnav-tierlog').addEventListener('click', () => { adminSubView = 'tierlog'; renderAdmin(); });
  const settingsBtn = document.getElementById('subnav-settings');
  if(settingsBtn) settingsBtn.addEventListener('click', () => { adminSubView = 'settings'; renderAdmin(); });

  if(adminSubView === 'punish'){
    renderAdminPunishments();

    renderAdminTierLog();
  }else if(adminSubView === 'settings' && isOwnerAdmin()){
    renderAdminSettings();
  }else{
    adminSubView = 'roster';
    renderAdminRoster();
  }
}

        <p>An extra PIN required before banning or deleting a player, on top of being logged in. Leave blank to turn this off.</p>
        <div class="hint" style="margin-bottom:10px;">${pinInfo && pinInfo.hasPin ? 'A PIN is currently set.' : 'No PIN is set — destructive actions aren\'t extra-gated.'}</div>
        <input id="owner-pin-input" type="text" inputmode="numeric" maxlength="8" placeholder="New PIN (leave blank to clear)" style="width:100%;margin-bottom:10px;">

    <details class="info-card settings-card" ${so("Visit analytics")}>
      <summary class="info-card-head">
        <div class="info-card-icon">📊</div>
        <h2>Visit analytics</h2>
      </summary>
      <div class="settings-card-body">
        <p>A basic, no-personal-data view count of the last ~5000 page loads.</p>
        <div class="hint" style="margin-bottom:10px;">Total page loads tracked: <strong>${analytics.total}</strong></div>
        ${analytics.byKit.length === 0 ? `<div class="empty">No data yet.</div>` : `
          <div class="admin-table">
            <div class="confirm-row head analytics-row"><div>Page</div><div>Views</div></div>
            ${analytics.byKit.map(([key, count]) => `
              <div class="confirm-row analytics-row">
                <div>${escapeHtml((GAMEMODES.find(g => g.id === key) || {}).label || key)}</div>
                <div>${count}</div>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </details>

    <details class="info-card settings-card" ${so("Ban reason presets")}>
      <summary class="info-card-head">
        <div class="info-card-icon">🚫</div>
        <h2>Ban reason presets</h2>
      </summary>
      <div class="settings-card-body">
        <p>Quick-pick reasons that show up as suggestions when banning a player, instead of typing one every time.</p>
        <div id="ban-preset-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
          ${siteSettings.ban_reason_presets.length === 0 ? `<span class="kit-chip-empty">No presets yet</span>` :
            siteSettings.ban_reason_presets.map((r, i) => `
              <span class="kit-chip" style="gap:6px;">${escapeHtml(r)}<button class="ban-preset-remove" data-idx="${i}" title="Remove" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:0;">✕</button></span>
            `).join('')}
